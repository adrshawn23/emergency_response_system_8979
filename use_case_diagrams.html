'The Kalubihan Emergency Response System allows the admin to oversee and manage all critical functions, including user and department management, access control, emergency records, and system notifications. After signing in, the admin can add or modify staff accounts (such as responders, dispatchers, and department administrators), validate sign-ups by checking submitted IDs, and either approve or disapprove access with appropriate notices. They can also configure which pages each role may open, add or edit department names, assign responders to incidents, and monitor reports and visual data on the dashboard. This centralized control ensures timely and organized emergency responses while maintaining secure and updated user access.',
'Residents or boarders have access to the public-facing side of the Kalubihan Emergency Response System. They can sign up and sign in, with both processes requiring the upload of a valid ID for verification and extending to forgot password recovery through a reset link sent via email. Upon successful access, they can manage their accounts (with options to log out and change password) and view emergency contacts and announcements. Their critical role is filing emergency reports, which include incident details and can be accompanied by photo evidence providing detailed context. They can also track the status of their submitted reports, receive notifications, and view alerts and updates to stay informed about emergency events in their area.',
'The Dispatcher role includes extended responsibilities over report handling in the Kalubihan Emergency Response System. They begin by signing in, with an option to retrieve a forgotten password through a reset link sent via email. They manage their account, with access to log out and change password features, and can view emergency contacts. Dispatchers are primarily responsible for report handling, which includes the ability to view, accept, or decline reports. If a report is accepted, they may choose to turn over the case, which includes assigning the department responsible for handling it. If a report is declined, a reason must be provided. They may also assign responders through the incident queue and post broadcast announcements. Like other users, they receive notifications and can view alerts and updates issued by the system or admins.',
'The Responder in the Kalubihan Emergency Response System is granted access to several functionalities. They can sign in to the system, with an option to recover their credentials using the forgot password feature, and the system includes the functionality to upload a valid ID, which may be required during account creation or sensitive operations. Once signed in, they can access account management options, which include the ability to log out or change their password. They are also allowed to view emergency contacts to ensure they can respond appropriately during crises. In the context of reporting, responders can view assigned incidents and accept or decline assignments. When resolving an incident, they must input resolution notes and may upload a resolution photo as evidence. Additionally, they receive notifications and have the ability to view alerts and updates related to emergencies or system announcements.',
'The Department Administrator oversees a specific department within the Kalubihan Emergency Response System. They sign in, with an option to recover a forgotten password through a reset link sent via email, and manage their account with the ability to log out or change their password. They can view emergency contacts and are responsible for department management, which includes viewing department members and updating department information. In the context of reporting, they can view incidents assigned to their department and coordinate the response, which includes dispatching responders to active incidents. Like other users, they receive notifications and can view alerts and updates issued by the system or admins.'
];

// ---- renderer ----
function rx(t){ var w=Math.max.apply(null,t.split('\n').map(function(s){return s.length;})); return Math.max(42, w*3.6+12); }
function ry(t){ return 13 + (t.split('\n').length-1)*7; }

function edge(a, b, xr, yr){
  // point on ellipse b boundary along a->b
  var dx=b.x-a.x, dy=b.y-a.y;
  var t=1/Math.sqrt((dx*dx)/(xr*xr)+(dy*dy)/(yr*yr));
  return {x:b.x-dx*t*0.98, y:b.y-dy*t*0.98};
}

function render(f, idx){
  var W=680, H=f.h, bx=115, bw=W-bx-15;
  var s='<svg width="'+W+'" height="'+H+'" xmlns="http://www.w3.org/2000/svg">';
  s+='<defs><marker id="arw'+idx+'" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#000" stroke-width="1"/></marker></defs>';
  s+='<rect x="'+bx+'" y="5" width="'+bw+'" height="'+(H-10)+'" fill="none" stroke="#000"/>';
  s+='<text x="'+(bx+bw-4)+'" y="18" text-anchor="end" class="uc" style="font-size:9px" fill="#666">'+SYS+'</text>';

  // actor
  var ax=55, ay=H/2;
  s+='<g stroke="#000" fill="none"><circle cx="'+ax+'" cy="'+(ay-38)+'" r="9"/><line x1="'+ax+'" y1="'+(ay-29)+'" x2="'+ax+'" y2="'+(ay+8)+'"/><line x1="'+(ax-15)+'" y1="'+(ay-15)+'" x2="'+(ax+15)+'" y2="'+(ay-15)+'"/><line x1="'+ax+'" y1="'+(ay+8)+'" x2="'+(ax-14)+'" y2="'+(ay+38)+'"/><line x1="'+ax+'" y1="'+(ay+8)+'" x2="'+(ax+14)+'" y2="'+(ay+38)+'"/></g>';
  f.actor.split('\n').forEach(function(ln,i){ s+='<text x="'+ax+'" y="'+(ay+54+i*12)+'" text-anchor="middle" class="uc">'+ln+'</text>'; });

  var byT={}; f.nodes.forEach(function(n){ byT[n.t]=n; });

  // links
  f.links.forEach(function(l){
    var a = l[0]==='a' ? {x:ax+15,y:ay-15,t:''} : byT[l[0]];
    var b = byT[l[1]]; var k=l[2]||'';
    var p = edge(a,b,rx(b.t),ry(b.t));
    var dash = k==='' ? '' : ' stroke-dasharray="4,3"';
    var arrow = k==='' ? '' : ' marker-end="url(#arw'+idx+')"';
    var sx = l[0]==='a' ? ax+12 : edge(b,a,rx(a.t),ry(a.t)).x;
    var sy = l[0]==='a' ? ay : edge(b,a,rx(a.t),ry(a.t)).y;
    s+='<line x1="'+sx+'" y1="'+sy+'" x2="'+p.x+'" y2="'+p.y+'" stroke="#000" stroke-width="1"'+dash+arrow+'/>';
    if(k){ var mx=(sx+p.x)/2, my=(sy+p.y)/2-3; s+='<text x="'+mx+'" y="'+my+'" text-anchor="middle" class="uc" style="font-size:8.5px">&lt;&lt;'+(k==='inc'?'include':'extend')+'&gt;&gt;</text>'; }
  });

  // ovals
  f.nodes.forEach(function(n){
    var RX=rx(n.t), RY=ry(n.t);
    s+='<ellipse cx="'+n.x+'" cy="'+n.y+'" rx="'+RX+'" ry="'+RY+'" fill="#fff" stroke="#000"/>';
    n.t.split('\n').forEach(function(ln,i){
      s+='<text x="'+n.x+'" y="'+(n.y+(i-(n.t.split('\n').length-1)/2)*11+4)+'" text-anchor="middle" class="uc">'+ln+'</text>';
    });
  });
  s+='</svg>';
  return s;
}

var out='';
F.forEach(function(f,i){

    '<p class="expl">'+PARAS[i]+'</p></div>';
});
